<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kids_rewards_game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kids_rewards_game</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fix CORS issues with Firebase Storage -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="credentialless" />

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  
  <!-- Image proxy bridge for CORS issues -->
  <script>
    window.loadImageViaJS = function(url, imageId) {
      // Este enfoque usa JavaScript para cargar imágenes eludiendo las restricciones CORS
      var img = new Image();
      img.crossOrigin = "anonymous"; // Intentar cargar con permisos CORS
      
      // Agregar timestamp para evitar cacheo
      var timestamp = new Date().getTime();
      var urlWithCache = url.includes('?') ? url + '&_t=' + timestamp : url + '?_t=' + timestamp;
      
      img.onload = function() {
        // Cuando la imagen está cargada, notificar al flutter
        window.flutter_inappwebview.callHandler('imageLoaded', imageId, true);
        console.log("Imagen cargada con éxito: " + imageId);
      };
      
      img.onerror = function(e) {
        // Cuando hay error, notificar al flutter
        console.error("Error cargando imagen: " + imageId, e);
        window.flutter_inappwebview.callHandler('imageLoaded', imageId, false);
      };
      
      // Iniciar carga
      img.src = urlWithCache;
      
      // Agregar la imagen al DOM temporalmente para que se muestre
      var container = document.createElement('div');
      container.id = 'img-container-' + imageId;
      container.style.display = 'none';
      container.appendChild(img);
      document.body.appendChild(container);
      
      return true;
    };
    
    // Función más simple que simplemente preprocesa la URL para Firebase Storage
    window.fixFirebaseStorageUrl = function(url) {
      if (url && url.includes('firebasestorage.googleapis.com')) {
        var timestamp = new Date().getTime();
        return url.includes('?') ? url + '&_t=' + timestamp : url + '?_t=' + timestamp;
      }
      return url;
    };
  </script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <!-- Firebase Core -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js"></script>

  <!-- Fix CORS issues with Firebase Storage images -->
  <script>
    window.addEventListener('error', function(e) {
      // Log image loading errors para diagnóstico
      if (e && e.target && (e.target.nodeName === 'IMG' || e.target.nodeName === 'LINK')) {
        console.error('Error cargando recurso:', e.target.src || e.target.href, e);
      }
    }, true);
  </script>
</body>
</html>
