name: kids_rewards_game
description: Juego de recompensas infantil para fomentar hábitos y autoestima.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.16.0
  firebase_auth: ^4.10.0
  cloud_firestore: ^4.9.2
  firebase_storage: ^11.2.7
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  image_picker: ^1.0.4
  easy_localization: ^3.0.3
  http: ^1.1.0
  cached_network_image: ^3.3.0
  lottie: ^2.4.0
  flutter_svg: ^2.0.7
  flutter_dotenv: ^5.1.0
  collection: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/animations/
    - assets/l10n/
