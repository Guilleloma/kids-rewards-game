name: kids_rewards_game
description: Juego de recompensas infantil para fomentar hábitos y autoestima.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Estado y utilidades
  flutter_riverpod: ^2.4.0
  easy_localization: ^3.0.2

  # Firebase
  firebase_core: ^2.15.1
  firebase_auth: ^4.7.0
  cloud_firestore: ^4.9.0
  firebase_storage: ^11.2.0

  # Imágenes y UI
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  lottie: ^2.4.0
  cupertino_icons: ^1.0.5
  flutter_svg: ^2.0.7
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/l10n/
